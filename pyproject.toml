[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[project]
name = "color-patch-maker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["reportlab==4.4.4", "pikepdf==10.0.2", "PySide6==6.8.3"]
[project.scripts]
cpm = "color_patch_maker.cli:main"
[tool.setuptools.packages.find]
include = ["color_patch_maker*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
